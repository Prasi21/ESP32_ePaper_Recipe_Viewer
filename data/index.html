		<button onclick="uploadImage()" class="red-button" style="width: 100%; margin: 16px 2px 5px;">Upload to Frame</button>

	<script>

		switch(r) {
		  case 0:	/*black*/
			return 0;
		case 255:	/*white*/
			return 1;
		case 128:	/*red*/
			return 3;
			}
	}
	var PALETTE = [
		[0, 0, 0],       // Black
		[255, 255, 255]  // White
	];

function sendImage() {
    const width = 800;
    const height = 480;

    const canvas = document.getElementById('editedCanvas');
    const ctx = canvas.getContext('2d');
    const image = ctx.getImageData(0, 0, width, height);
    const pixels = image.data;

    // Eight monochrome pixels per byte.
    const bytes = new Uint8Array(width * height / 8);

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const pixelIndex = (y * width + x) * 4;

            const r = pixels[pixelIndex];
            const g = pixels[pixelIndex + 1];
            const b = pixels[pixelIndex + 2];

            // Convert RGB to perceived brightness.
            const brightness =
                0.299 * r + 0.587 * g + 0.114 * b;

            // Black = 1, white = 0 in the input buffer.
            if (brightness < 128) {
                const byteIndex = y * (width / 8)
                                + Math.floor(x / 8);
                const bitPosition = 7 - (x % 8);

                bytes[byteIndex] |= (1 << bitPosition);
            }
        }
    }

	console.log("Image byte length:", bytes.length);

	for (const y of [0, 40, 80, 120, 160, 200, 240, 280, 320, 360, 400, 440]) {
		const rowStart = y * 100;
		console.log(
			`Row ${y}:`,
			Array.from(bytes.slice(rowStart, rowStart + 5))
				.map(b => b.toString(16).padStart(2, "0"))
				.join(" ")
		);
	}

	console.log(
    "Row 0 selected bytes:",
    [0, 1, 2, 50, 99].map(i => bytes[i].toString(16).padStart(2, "0"))
	);

    console.log("Sending monochrome image:", bytes.length, "bytes");
    websocket.send(bytes.buffer);
    console.log("Image sent");
    websocket.close();
}

	var ditherLevel = 16;
	var sliderDither = document.getElementById("rangeDither");
	var outputDither = document.getElementById("ditherLevel");
	outputDither.innerHTML = sliderDither.value;
	sliderDither.oninput = function() {
	  outputDither.innerHTML = this.value;
	  ditherLevel = this.value;
	};
	
	var sliderContrast = document.getElementById("rangeContrast");
	var outputContrast = document.getElementById("contrastLevel");
	outputContrast.innerHTML = sliderContrast.value;
	sliderContrast.oninput = function() {
	
		outputContrast.innerHTML = this.value;
		var ctx = document.getElementById('originalCanvas').getContext('2d');
		var imgData = ctx.getImageData(0,0,800,480);
		
		imgData = contrastImage(imgData, this.value);
		
		ctx = document.getElementById('editedCanvas').getContext('2d');
		ctx.putImageData(imgData, 0, 0);
	};
	
	function contrastImage(imgData, contrast){  /*input range [-100..100]*/
		var d = imgData.data;
		contrast = (contrast/100) + 1;  /*convert to decimal & shift range: [0..2]*/
		var intercept = 128 * (1 - contrast);
		for(var i=0;i<d.length;i+=4){   /*r,g,b,a*/
			d[i] = d[i]*contrast + intercept;
			d[i+1] = d[i+1]*contrast + intercept;
			d[i+2] = d[i+2]*contrast + intercept;
		}
		return imgData;
	}
	
	var input = document.getElementById('inputFile');
	input.addEventListener('change', handleFiles);

	/*load the file to the two canvases*/
	function handleFiles(e) {
		var ctxOrigin = document.getElementById('originalCanvas').getContext('2d');
		var ctxEdited = document.getElementById('editedCanvas').getContext('2d');
		var img = new Image;
		img.src = URL.createObjectURL(e.target.files[0]);
		img.onload = function() {
			ctxOrigin.drawImage(img, 0, 0, img.width,    img.height,    /*source rectangle*/
			   0, 0, 800, 480); /*destination rectangle*/
			ctxEdited.drawImage(img, 0, 0, img.width,    img.height,     /*source rectangle*/
			   0, 0, 800, 480); /*destination rectangle*/
		}
	}

	var PALETTE = [
		[0, 0, 0],       // Black
		[255, 255, 255]  // White
	];	

	function dist_to_pixel(r, g, b, color){
		var d1 = Math.abs(r-color[0]);
		var d2 = Math.abs(g-color[1]);
		var d3 = Math.abs(b-color[2]);
		return (d1 + d2 + d3);
	}
	
	function find_closest_palette_color(r, g, b){
		var min_dist = 1000;
		var closest_color = [0,255,0];
		var color;
		for(color of PALETTE){
			dist = dist_to_pixel(r, g, b,color);
			if(dist < min_dist){
				min_dist = dist;
				closest_color = color;
			}
		}
		
		return closest_color;
	}
	
	function addToPixel(pixels, pos, quant_error, fraction){
		if( pos < pixels.length ){
			pixels[pos+0] += quant_error[0] * fraction ;
			if(pixels[pos+0] < 0)   pixels[pos+0] = 0;
			if(pixels[pos+0] > 255) pixels[pos+0] = 255;
			
			pixels[pos+1] += quant_error[1] * fraction ;
			if(pixels[pos+1] < 0)   pixels[pos+1] = 0;
			if(pixels[pos+1] > 255) pixels[pos+1] = 255;
			
			pixels[pos+2] += quant_error[2] * fraction ;
			if(pixels[pos+2] < 0)   pixels[pos+2] = 0;
			if(pixels[pos+2] > 255) pixels[pos+2] = 255;
		}
		
	}


function dither() {
    const width = 800;
    const height = 480;

    const canvas = document.getElementById('editedCanvas');
    const ctx = canvas.getContext('2d');
    const image = ctx.getImageData(0, 0, width, height);
    const pixels = image.data;

    // Work with greyscale values and diffuse quantisation error.
    const grey = new Float32Array(width * height);

    for (let i = 0; i < grey.length; i++) {
        const p = i * 4;
        grey[i] = 0.299 * pixels[p]
                + 0.587 * pixels[p + 1]
                + 0.114 * pixels[p + 2];
    }

    function addError(x, y, error, weight) {
        if (x >= 0 && x < width && y >= 0 && y < height) {
            grey[y * width + x] += error * weight;
        }
    }

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const i = y * width + x;
            const oldValue = grey[i];
            const newValue = oldValue < 128 ? 0 : 255;
            const error = oldValue - newValue;

            grey[i] = newValue;

            addError(x + 1, y,     error, 7 / 16);
            addError(x - 1, y + 1, error, 3 / 16);
            addError(x,     y + 1, error, 5 / 16);
            addError(x + 1, y + 1, error, 1 / 16);
        }
    }

    for (let i = 0; i < grey.length; i++) {
        const p = i * 4;
        const value = grey[i] < 128 ? 0 : 255;

        pixels[p] = value;
        pixels[p + 1] = value;
        pixels[p + 2] = value;
        pixels[p + 3] = 255;
    }

    ctx.putImageData(image, 0, 0);
}
